<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenBrain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3350;
      --accent: #6c8ef5; --accent-dim: #3d4f8a; --text: #e2e4f0; --text-dim: #7b82a8;
      --green: #4ade80; --amber: #fbbf24; --red: #f87171;
      --radius: 10px; --font: 'Inter', system-ui, sans-serif; --base-size: 18px;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    body { background: var(--bg); color: var(--text); font-size: var(--base-size); font-family: var(--font); height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-dim); }
    header .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); transition: background 0.3s; }
    header .dot.connected { background: var(--green); }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .msg { display: flex; flex-direction: column; max-width: 78%; gap: 4px; animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.brain { align-self: flex-start; align-items: flex-start; }
    .bubble { padding: 10px 14px; border-radius: var(--radius); line-height: 1.55; font-size: 1rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user .bubble { background: var(--accent-dim); border-bottom-right-radius: 3px; }
    .msg.brain .bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
    .bubble .md-bold { font-weight: 600; color: #fff; }
    .bubble .md-em   { color: var(--text-dim); }
    .bubble .md-code { font-family: var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 3px; font-size: 0.82em; }
    .meta { font-size: 0.68rem; color: var(--text-dim); display: flex; gap: 8px; }
    .badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 0.65rem; color: var(--accent); }
    .badge.decision { color: var(--amber); }
    .badge.insight  { color: var(--green); }
    .badge.person   { color: #c084fc; }
    .badge.meeting  { color: #22d3ee; }
    .badge.error    { color: var(--red); }
    .typing .bubble { display: flex; gap: 4px; align-items: center; padding: 12px 16px; }
    .dot-pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: pulse 1.2s ease-in-out infinite; }
    .dot-pulse:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,80%,100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
    #input-bar { padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; }
    #input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; color: var(--text); font-family: var(--font); font-size: 1rem; outline: none; resize: none; line-height: 1.5; max-height: 120px; transition: border-color 0.2s; }
    #input:focus { border-color: var(--accent-dim); }
    #input::placeholder { color: var(--text-dim); }
    #send { background: var(--accent); border: none; border-radius: var(--radius); padding: 10px 18px; color: #fff; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: opacity 0.15s; align-self: flex-end; }
    #send:hover:not(:disabled) { opacity: 0.85; }
    #send:disabled { opacity: 0.4; cursor: not-allowed; }
    #empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-dim); text-align: center; pointer-events: none; }
    #empty .icon { font-size: 2.5rem; opacity: 0.5; }
    #empty p { font-size: 0.85rem; max-width: 280px; line-height: 1.6; }

    /* ── search results (structured list, deliberately NOT a chat bubble) ── */
    .results { align-self: stretch; max-width: 100%; display: flex; flex-direction: column; gap: 8px; animation: fadeIn 0.15s ease; }
    .results-head { display: flex; align-items: baseline; gap: 8px; font-size: 0.72rem; color: var(--text-dim); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
    .results-count { color: var(--text); }
    .results-empty { padding: 14px; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--text-dim); font-size: 0.9rem; text-align: center; }
    .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s; }
    .result-card:hover { border-color: var(--accent-dim); }
    .result-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.68rem; color: var(--text-dim); font-family: var(--mono); }
    .result-score-wrap { position: relative; margin-left: auto; display: inline-flex; }
    .result-score { color: var(--accent); cursor: help; border-bottom: 1px dotted var(--accent-dim); }
    .score-tooltip { position: absolute; z-index: 10; right: 0; top: calc(100% + 8px); width: 280px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 0.72rem; line-height: 1.45; font-weight: 400; letter-spacing: normal; text-transform: none; text-align: left; box-shadow: 0 5px 18px rgba(0,0,0,0.45); opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-3px); transition: opacity 0.12s ease, transform 0.12s ease, visibility 0.12s; }
    .result-score-wrap:hover .score-tooltip, .result-score-wrap:focus-within .score-tooltip { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
    .result-tag { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; font-size: 0.62rem; color: var(--text-dim); }
    /* Clamp: collapsed cards cap height and fade out; .expanded lifts the cap. */
    .result-body { position: relative; overflow: hidden; max-height: 5.6rem; font-size: 0.95rem; line-height: 1.55; word-break: break-word; }
    .result-body.expanded { max-height: none; }
    .result-body::after { content: ''; position: absolute; inset: auto 0 0 0; height: 1.8rem; background: linear-gradient(transparent, var(--surface)); pointer-events: none; transition: opacity 0.15s; }
    .result-body.expanded::after { opacity: 0; }
    .result-body p { margin: 0 0 0.5em; }
    .result-body p:last-child { margin-bottom: 0; }
    .result-body ul { margin: 0 0 0.5em; padding-left: 1.2em; }
    .result-body ul:last-child { margin-bottom: 0; }
    .result-body li { margin: 0.15em 0; }
    .result-body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: 0 0 0.5em; }
    .result-body pre:last-child { margin-bottom: 0; }
    .result-body pre code { font-family: var(--mono); font-size: 0.8rem; color: var(--text); background: none; padding: 0; }
    .result-actions { display: flex; align-items: center; gap: 8px; }
    .result-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); font-family: var(--font); font-size: 0.7rem; padding: 3px 9px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .result-btn:hover { border-color: var(--accent-dim); color: var(--text); }

    /* ── thought detail panel ── */
    #detail-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 92vw); background: var(--surface); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform 0.18s ease; display: flex; flex-direction: column; z-index: 60; }
    #detail-panel.open { transform: translateX(0); }
    #detail-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #detail-head h2 { font-size: 0.9rem; font-weight: 600; }
    #detail-close { margin-left: auto; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); font-family: var(--font); font-size: 0.7rem; padding: 3px 9px; cursor: pointer; }
    #detail-close:hover { border-color: var(--red); color: var(--red); }
    #detail-content { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.95rem; line-height: 1.6; }
    #detail-content .detail-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.68rem; color: var(--text-dim); font-family: var(--mono); }
    #detail-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.18s; z-index: 55; }
    #detail-backdrop.open { opacity: 1; pointer-events: auto; }
  </style>

</head>
<body>
<header>
  <span aria-hidden="true">🧠</span>
  <h1>OpenBrain</h1>
  <a id="graph-link" href="/graph" style="margin-left:auto;font-size:0.75rem;color:var(--text-dim);text-decoration:none;display:flex;align-items:center;gap:4px;padding:3px 9px;border:1px solid var(--border);border-radius:6px;" onmouseover="this.style.borderColor='var(--accent-dim)';this.style.color='var(--text)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-dim)'">🗺 Brain Map</a>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>
<div id="messages" role="log" aria-live="polite">
  <div id="empty">
    <div class="icon" aria-hidden="true">🧠</div>
    <p>Type a thought to capture it, or ask a question to search your brain.</p>
    <p>Type <strong>help</strong> to see all commands.</p>
  </div>
</div>
<div id="input-bar">
  <textarea id="input" rows="1" placeholder="Capture a thought, or search your brain…" aria-label="Message input" autofocus></textarea>
  <button id="send" disabled aria-label="Send message">Send</button>
</div>
<div id="detail-backdrop"></div>
<div id="detail-panel" role="dialog" aria-modal="true" aria-label="Note detail" aria-hidden="true">
  <div id="detail-head">
    <h2 id="detail-title">Note</h2>
    <button id="detail-close" aria-label="Close note detail">Close ✕</button>
  </div>
  <div id="detail-content"></div>
</div>
<script>
'use strict';
const messagesEl = document.getElementById('messages');
const emptyEl    = document.getElementById('empty');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send');
const dotEl      = document.getElementById('dot');
const statusEl   = document.getElementById('status-text');

function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

// Safe markdown rendering — splits text on tokens, builds DOM nodes, no innerHTML for content
function renderMarkdownSafe(text, container) {
  // Split on **bold**, *em*, `code` tokens
  const parts = text.split(/(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`)/);
  parts.forEach(function(part) {
    if (part.startsWith('**') && part.endsWith('**')) {
      const s = el('span', 'md-bold');
      s.textContent = part.slice(2, -2);
      container.appendChild(s);
    } else if (part.startsWith('*') && part.endsWith('*') && part.length > 2) {
      const s = el('span', 'md-em');
      s.textContent = part.slice(1, -1);
      container.appendChild(s);
    } else if (part.startsWith('`') && part.endsWith('`') && part.length > 2) {
      const s = el('span', 'md-code');
      s.textContent = part.slice(1, -1);
      container.appendChild(s);
    } else {
      container.appendChild(document.createTextNode(part));
    }
  });
}

// Block-aware markdown rendering for note bodies.
//
// The bubble renderer above only handles inline tokens and leans on the
// bubble's `white-space: pre-wrap` for structure, which reads as a mushy text
// dump inside a result card. This builds real block elements — paragraphs,
// lists, fenced code — and applies the inline tokenizer within each line.
// Everything is DOM-constructed (never innerHTML), so note content is always
// treated as text, not markup.
function renderNoteBody(text, container) {
  const lines = String(text == null ? '' : text).replace(/\r\n/g, '\n').split('\n');
  let i = 0;

  const flushParagraph = function(buf) {
    if (!buf.length) return;
    const p = el('p');
    buf.forEach(function(line, idx) {
      if (idx > 0) p.appendChild(el('br'));
      renderMarkdownSafe(line, p);
    });
    container.appendChild(p);
  };

  while (i < lines.length) {
    const line = lines[i];

    // Fenced code block: consume through the closing fence (or end of text).
    const fence = line.match(/^\s*```(.*)$/);
    if (fence) {
      i++;
      const code = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) {
        code.push(lines[i]);
        i++;
      }
      if (i < lines.length) i++; // skip closing fence
      const pre = el('pre');
      const codeEl = el('code');
      codeEl.textContent = code.join('\n');
      pre.appendChild(codeEl);
      container.appendChild(pre);
      continue;
    }

    // Bullet list: consume the whole contiguous run.
    if (/^\s*[-*•]\s+/.test(line)) {
      const ul = el('ul');
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
        const li = el('li');
        renderMarkdownSafe(lines[i].replace(/^\s*[-*•]\s+/, ''), li);
        ul.appendChild(li);
        i++;
      }
      container.appendChild(ul);
      continue;
    }

    // Blank line: paragraph separator.
    if (/^\s*$/.test(line)) {
      i++;
      continue;
    }

    // Plain paragraph: gather until a blank line or a block starter.
    const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) &&
           !/^\s*[-*•]\s+/.test(lines[i]) && !/^\s*```/.test(lines[i])) {
      buf.push(lines[i]);
      i++;
    }
    flushParagraph(buf);
  }

  // Guarantee the container is never left empty (e.g. whitespace-only note).
  if (!container.childNodes.length) {
    container.appendChild(document.createTextNode(''));
  }
}

function makeMsg(side) {
  const wrap = el('div', 'msg ' + side);
  const bubble = el('div', 'bubble');
  const meta   = el('div', 'meta');
  wrap.appendChild(bubble);
  wrap.appendChild(meta);
  return { wrap, bubble, meta };
}

function timeStr() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function hideEmpty() { if (emptyEl) emptyEl.style.display = 'none'; }
function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function appendUser(text) {
  hideEmpty();
  const { wrap, bubble, meta } = makeMsg('user');
  bubble.textContent = text;
  meta.textContent = timeStr();
  messagesEl.appendChild(wrap);
  scrollBottom();
}

// ── search results ──────────────────────────────────────────────────────────
//
// Search is a note-finder, not a conversation: results render as a structured
// list of discrete cards rather than a chat bubble containing a text dump.
// The backend sends `results` (structured rows) alongside `content` (the
// legacy plain-text rendering); we use the former and ignore the latter.

function tokenQS() {
  const token = new URLSearchParams(location.search).get('token') || '';
  return token ? '?token=' + encodeURIComponent(token) : '';
}

function typeBadge(type) {
  const badge = el('span', 'badge ' + (type || 'note'));
  badge.textContent = type || 'note';
  return badge;
}

// Builds one result card. The body is clamped by CSS; the expand toggle is
// only attached when the content actually overflows, so short notes get no
// dead affordance.
function buildResultCard(row) {
  const card = el('article', 'result-card');

  const meta = el('div', 'result-meta');
  meta.appendChild(typeBadge(row.type));
  if (row.created_at) {
    meta.appendChild(document.createTextNode(row.created_at));
  }
  (row.tags || []).forEach(function(tag) {
    const t = el('span', 'result-tag');
    t.textContent = tag;
    meta.appendChild(t);
  });
  if (typeof row.score === 'number') {
    const scoreWrap = el('span', 'result-score-wrap');
    const score = el('span', 'result-score');
    score.textContent = row.score.toFixed(2);
    score.setAttribute('aria-label', 'Relevance score ' + row.score.toFixed(2));
    const tooltip = el('span', 'score-tooltip');
    tooltip.textContent = 'Relevance score: a hybrid ranking from semantic similarity (70%) and keyword matching (30%). Higher scores indicate stronger relevance within this search; it is not a percentage or probability.';
    scoreWrap.appendChild(score);
    scoreWrap.appendChild(tooltip);
    meta.appendChild(scoreWrap);
  }
  card.appendChild(meta);

  const body = el('div', 'result-body');
  // Prefer the summary as the preview when the backend supplied one.
  renderNoteBody(row.summary ? row.summary : row.content, body);
  card.appendChild(body);

  const actions = el('div', 'result-actions');
  const openBtn = el('button', 'result-btn');
  openBtn.textContent = 'Open note';
  openBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    openDetail(row.id);
  });
  actions.appendChild(openBtn);
  card.appendChild(actions);

  // Attach the expand toggle only if the body is actually clipped. Measured
  // after layout so scrollHeight/clientHeight are meaningful.
  requestAnimationFrame(function() {
    if (body.scrollHeight - body.clientHeight < 4) {
      // Nothing hidden — drop the fade so the card looks intentional.
      body.classList.add('expanded');
      return;
    }
    const toggle = el('button', 'result-btn');
    toggle.textContent = 'Show more';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.addEventListener('click', function(e) {
      e.stopPropagation();
      const expanded = body.classList.toggle('expanded');
      toggle.textContent = expanded ? 'Show less' : 'Show more';
      toggle.setAttribute('aria-expanded', String(expanded));
    });
    actions.insertBefore(toggle, actions.firstChild);
  });

  // Clicking the card surface (not a button) opens the full note.
  card.addEventListener('click', function() { openDetail(row.id); });

  return card;
}

function appendSearchResults(data) {
  hideEmpty();
  const rows = Array.isArray(data.results) ? data.results : [];
  const wrap = el('div', 'results');

  const head = el('div', 'results-head');
  const count = el('span', 'results-count');
  count.textContent = rows.length === 1 ? '1 result' : rows.length + ' results';
  head.appendChild(count);
  head.appendChild(document.createTextNode(timeStr()));
  wrap.appendChild(head);

  if (!rows.length) {
    const none = el('div', 'results-empty');
    none.textContent = 'No matching notes.';
    wrap.appendChild(none);
  } else {
    rows.forEach(function(row) { wrap.appendChild(buildResultCard(row)); });
  }

  messagesEl.appendChild(wrap);
  scrollBottom();
}

// ── note detail panel ───────────────────────────────────────────────────────
const detailPanel    = document.getElementById('detail-panel');
const detailBackdrop = document.getElementById('detail-backdrop');
const detailContent  = document.getElementById('detail-content');
const detailTitle    = document.getElementById('detail-title');
const detailCloseBtn = document.getElementById('detail-close');
let lastFocused = null;

function closeDetail() {
  detailPanel.classList.remove('open');
  detailBackdrop.classList.remove('open');
  detailPanel.setAttribute('aria-hidden', 'true');
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

detailCloseBtn.addEventListener('click', closeDetail);
detailBackdrop.addEventListener('click', closeDetail);
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && detailPanel.classList.contains('open')) closeDetail();
});

async function openDetail(id) {
  if (!id) return;
  lastFocused = document.activeElement;
  detailPanel.classList.add('open');
  detailBackdrop.classList.add('open');
  detailPanel.setAttribute('aria-hidden', 'false');
  detailTitle.textContent = 'Note';
  detailContent.textContent = 'Loading…';
  detailCloseBtn.focus();

  try {
    const res = await fetch('/api/thought/' + encodeURIComponent(id) + tokenQS());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const t = await res.json();

    detailTitle.textContent = t.type || 'Note';
    detailContent.textContent = '';

    const meta = el('div', 'detail-meta');
    meta.appendChild(typeBadge(t.type));
    if (t.created_at) meta.appendChild(document.createTextNode(t.created_at));
    if (t.source) {
      const src = el('span', 'result-tag');
      src.textContent = t.source;
      meta.appendChild(src);
    }
    (t.tags || []).forEach(function(tag) {
      const el2 = el('span', 'result-tag');
      el2.textContent = tag;
      meta.appendChild(el2);
    });
    detailContent.appendChild(meta);

    if (t.summary) {
      const sum = el('div', 'result-body expanded');
      renderNoteBody(t.summary, sum);
      detailContent.appendChild(sum);
    }

    const bodyWrap = el('div', 'result-body expanded');
    renderNoteBody(t.content, bodyWrap);
    detailContent.appendChild(bodyWrap);
  } catch (err) {
    detailContent.textContent = 'Failed to load note: ' + err.message;
  }
}

function appendBrain(text, intent, thoughtType) {
  hideEmpty();
  const { wrap, bubble, meta } = makeMsg('brain');
  renderMarkdownSafe(text, bubble);
  const badgeClass = intent === 'capture' ? (thoughtType || 'note') : (intent || '');
  const badgeLabel = intent === 'capture' ? (thoughtType || 'note') : intent;
  const timeNode = document.createTextNode(timeStr() + ' ');
  const badge = el('span', 'badge ' + badgeClass);
  badge.textContent = badgeLabel;
  meta.appendChild(timeNode);
  meta.appendChild(badge);
  messagesEl.appendChild(wrap);
  scrollBottom();
}

let typingEl = null;
function showTyping() {
  if (typingEl) return;
  typingEl = el('div', 'msg brain typing');
  const bubble = el('div', 'bubble');
  [0,1,2].forEach(function() { bubble.appendChild(el('div', 'dot-pulse')); });
  typingEl.appendChild(bubble);
  messagesEl.appendChild(typingEl);
  scrollBottom();
}
function removeTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

// WebSocket with auto-reconnect
let ws;
let reconnectDelay = 1000;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws' + location.search);
  ws.onopen = function() {
    dotEl.classList.add('connected');
    statusEl.textContent = 'Connected';
    sendBtn.disabled = false;
    reconnectDelay = 1000;
  };
  ws.onclose = function() {
    dotEl.classList.remove('connected');
    statusEl.textContent = 'Reconnecting…';
    sendBtn.disabled = true;
    removeTyping();
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
  };
  ws.onerror = function() { ws.close(); };
  ws.onmessage = function(e) {
    removeTyping();
    let data;
    try { data = JSON.parse(e.data); } catch(err) { return; }
    // Search replies carry structured rows and render as a result list.
    // Every other intent keeps the existing conversational bubble.
    if (data.intent === 'search' && Array.isArray(data.results)) {
      appendSearchResults(data);
      return;
    }
    appendBrain(data.content || '', data.intent || '', data.thought_type || '');
  };
}

connect();

function send() {
  const text = inputEl.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  appendUser(text);
  ws.send(JSON.stringify({ message: text }));
  showTyping();
  inputEl.value = '';
  inputEl.style.height = 'auto';
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', function() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Forward ?token= (and any other query params) to the Brain Map link so the
// token is carried across navigation when the server has auth enabled.
if (location.search) {
  var graphLink = document.getElementById('graph-link');
  if (graphLink) { graphLink.href = '/graph' + location.search; }
}
</script>
</body>
</html>

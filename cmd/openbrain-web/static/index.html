<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenBrain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3350;
      --accent: #6c8ef5; --accent-dim: #3d4f8a; --text: #e2e4f0; --text-dim: #7b82a8;
      --green: #4ade80; --amber: #fbbf24; --red: #f87171;
      --radius: 10px; --font: 'Inter', system-ui, sans-serif; --base-size: 18px;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    body { background: var(--bg); color: var(--text); font-size: var(--base-size); font-family: var(--font); height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 10px; padding: 0 20px; height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    header span[aria-hidden="true"] { font-size: 22px; line-height: 1; }
    header h1 { font-size: 19.8px; font-weight: 600; }
    header .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-dim); }
    header .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); transition: background 0.3s; }
    header .dot.connected { background: var(--green); }
    #messages { flex: 1; overflow-y: auto; padding: 20px 20px 150px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .msg { display: flex; flex-direction: column; max-width: 78%; gap: 4px; animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.brain { align-self: flex-start; align-items: flex-start; }
    .bubble { padding: 10px 14px; border-radius: var(--radius); line-height: 1.55; font-size: 1rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user .bubble { background: var(--accent-dim); border-bottom-right-radius: 3px; }
    .msg.brain .bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
    .bubble .md-bold { font-weight: 600; color: #fff; }
    .bubble .md-em   { color: var(--text-dim); }
    .bubble .md-code { font-family: var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 3px; font-size: 0.82em; }
    .meta { font-size: 0.68rem; color: var(--text-dim); display: flex; gap: 8px; }
    .badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 0.65rem; color: var(--accent); }
    .badge.decision { color: var(--amber); }
    .badge.insight  { color: var(--green); }
    .badge.person   { color: #c084fc; }
    .badge.meeting  { color: #22d3ee; }
    .badge.error    { color: var(--red); }
    .typing .bubble { display: flex; gap: 4px; align-items: center; padding: 12px 16px; }
    .dot-pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: pulse 1.2s ease-in-out infinite; }
    .dot-pulse:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,80%,100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
    #empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-dim); text-align: center; pointer-events: none; }
    #empty .icon { font-size: 2.5rem; opacity: 0.5; }
    #empty p { font-size: 0.85rem; max-width: 280px; line-height: 1.6; }
    .ambiguity { align-self: flex-start; max-width: 78%; display: flex; flex-direction: column; gap: 8px; animation: fadeIn 0.15s ease; }
    .ambiguity-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; line-height: 1.5; font-size: 0.9rem; }
    .ambiguity-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .ambiguity-actions button { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 6px 10px; cursor: pointer; font-family: var(--font); font-size: 0.78rem; }
    .ambiguity-actions button:hover { border-color: var(--accent); color: var(--accent); }

    /* ── search results (structured list, deliberately NOT a chat bubble) ── */
    .results { align-self: stretch; max-width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; animation: fadeIn 0.15s ease; }
    .results-head, .search-work, .results-empty, .summary-card { grid-column: 1 / -1; }
    @media (min-width: 960px) { .results { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .search-work { border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,0.025); overflow: hidden; }
    .search-work summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 12px; color: var(--text-dim); font-size: 0.78rem; }
    .search-work summary::-webkit-details-marker { display: none; }
    .search-work summary::before { content: '›'; color: var(--accent); font-size: 1.15rem; line-height: 0.7; transform: rotate(0deg); transition: transform 0.18s; }
    .search-work[open] summary::before { transform: rotate(90deg); }
    .search-work-content { padding: 0 12px 11px 30px; color: var(--text-dim); font-size: 0.78rem; line-height: 1.55; }
    .search-query { display: block; margin-top: 4px; color: var(--text); font-family: var(--mono); font-size: 0.72rem; white-space: normal; word-break: break-word; }
    .results-head { display: flex; align-items: baseline; gap: 8px; font-size: 0.72rem; color: var(--text-dim); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
    .results-count { color: var(--text); }
    .results-empty { padding: 14px; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--text-dim); font-size: 0.9rem; text-align: center; }
     .result-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s, opacity 0.15s, transform 0.15s, box-shadow 0.15s; }
     .result-card:hover { border-color: var(--accent-dim); }
     .result-card.ranked { border-left-width: 3px; }
     .result-card.rank-1 { border-color: var(--accent); border-left-color: var(--accent); box-shadow: 0 8px 24px rgba(108,142,245,0.14); }
     .result-card.rank-2 { border-left-color: #8ea6ff; }
     .result-card.rank-3 { border-left-color: #778bd0; }
     .result-card.rank-low { opacity: 0.72; }
     .result-card.rank-low:hover { opacity: 1; }
     .result-card.compact { min-height: 0; padding: 9px 12px; gap: 5px; }
     .result-card.compact .result-meta { gap: 6px; }
     .result-card.compact .result-body { max-height: 1.55rem; }
     .result-card.compact .result-body::after { display: none; }
     .result-card.compact .note-body { font-size: 0.82rem; line-height: 1.45; white-space: nowrap; text-overflow: ellipsis; }
     .result-card.compact .result-actions { margin-top: 0; }
     .result-card.standard .result-body { max-height: 4.4rem; }
     .result-card.full { padding-top: 14px; padding-bottom: 14px; }
     .result-card.full .note-body { font-size: 1rem; }
     .result-kind { color: var(--text-dim); font-size: 0.61rem; letter-spacing: 0.04em; text-transform: uppercase; }
     .compact .result-kind { color: var(--text-dim); }
     .full .result-kind { color: var(--accent); }
     .rank-label { display: inline-flex; align-items: center; gap: 5px; color: var(--text-dim); font-size: 0.62rem; letter-spacing: 0.04em; text-transform: uppercase; }
     .rank-1 .rank-label { color: var(--accent); font-weight: 700; }
     .rank-number { font-family: var(--mono); color: inherit; }
     .result-relevance { height: 3px; border-radius: 99px; background: rgba(108,142,245,0.12); overflow: hidden; }
     .result-relevance::after { content: ''; display: block; width: calc(var(--rank-strength) * 100%); height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); }
     .summary-card { background: linear-gradient(145deg, rgba(108,142,245,0.14), var(--surface)); border-color: rgba(108,142,245,0.48); }
     .summary-card:hover { border-color: var(--accent); }
     .summary-card .result-meta { color: var(--accent); }
     .summary-card .result-meta .badge { color: var(--accent); border-color: rgba(108,142,245,0.45); }
    .result-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.68rem; color: var(--text-dim); font-family: var(--mono); }
    .result-score-wrap { position: relative; margin-left: auto; display: inline-flex; }
    .result-score { color: var(--accent); cursor: help; border-bottom: 1px dotted var(--accent-dim); }
    .score-tooltip { position: absolute; z-index: 10; right: 0; top: calc(100% + 8px); width: 310px; padding: 11px 13px; border: 1px solid rgba(108,142,245,0.35); border-radius: 9px; background: linear-gradient(145deg, var(--surface2), var(--bg)); color: var(--text); font-family: var(--font); font-size: 0.72rem; line-height: 1.5; font-weight: 400; letter-spacing: normal; text-transform: none; text-align: left; box-shadow: 0 9px 25px rgba(0,0,0,0.48), 0 0 0 1px rgba(255,255,255,0.025) inset; opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-4px); transition: opacity 0.14s ease, transform 0.14s ease, visibility 0.14s; }
    .result-score-wrap:hover .score-tooltip, .result-score-wrap:focus-within .score-tooltip { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
    .tooltip-title { display: block; margin-bottom: 4px; color: var(--text); font-weight: 600; font-size: 0.74rem; }
    .tooltip-copy { display: block; color: var(--text-dim); }
    .search-mode-wrap { position: relative; display: inline-flex; }
    .search-mode-wrap .score-tooltip { left: 0; right: auto; top: auto; bottom: calc(100% + 10px); width: 330px; transform: translateY(4px); }
    .search-mode-wrap:hover .score-tooltip, .search-mode-wrap:focus-within .score-tooltip { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
    @media (max-width: 640px) { .search-mode-wrap .score-tooltip { left: auto; right: 0; width: min(330px, calc(100vw - 40px)); } }
    .result-tag { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; font-size: 0.62rem; color: var(--text-dim); }
    /* Clamp: collapsed cards cap height and fade out; .expanded lifts the cap. */
    .note-body { font-size: 0.95rem; line-height: 1.55; word-break: break-word; }
    .result-body { position: relative; overflow: hidden; max-height: 5.6rem; }
    .result-body.expanded { max-height: none; }
    .result-body::after { content: ''; position: absolute; inset: auto 0 0 0; height: 1.8rem; background: linear-gradient(transparent, var(--surface)); pointer-events: none; transition: opacity 0.15s; }
    .result-body.expanded::after { opacity: 0; }
    .note-body p { margin: 0 0 0.5em; }
    .note-body p:last-child { margin-bottom: 0; }
    .note-body ul { margin: 0 0 0.5em; padding-left: 1.2em; }
    .note-body ul:last-child { margin-bottom: 0; }
     .note-body li { margin: 0.15em 0; }
     .note-body h1, .note-body h2, .note-body h3, .note-body h4 { margin: 0.7em 0 0.3em; color: var(--text); line-height: 1.25; }
     .note-body h1 { font-size: 1.25em; }
     .note-body h2 { font-size: 1.12em; }
     .note-body h3 { font-size: 1em; }
     .note-body h4 { font-size: 0.92em; }
     .note-body h1:first-child, .note-body h2:first-child, .note-body h3:first-child, .note-body h4:first-child { margin-top: 0; }
    .note-body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: 0 0 0.5em; }
    .note-body pre:last-child { margin-bottom: 0; }
    .note-body pre code { font-family: var(--mono); font-size: 0.8rem; color: var(--text); background: none; padding: 0; }
     .result-actions { display: none; }
     .summary-actions { display: flex; }
     .result-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); font-family: var(--font); font-size: 0.7rem; padding: 3px 9px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
     .result-btn:hover { border-color: var(--accent-dim); color: var(--text); }
     .result-btn.danger:hover { border-color: var(--red); color: var(--red); }

  </style>
  <link rel="stylesheet" href="/detail.css" />
  <link rel="stylesheet" href="/composer.css" />

</head>
<body>
<header>
  <span aria-hidden="true">🧠</span>
  <h1>OpenBrain</h1>
  <a id="graph-link" href="/graph" style="margin-left:auto;font-size:0.75rem;color:var(--text-dim);text-decoration:none;display:flex;align-items:center;gap:4px;padding:3px 9px;border:1px solid var(--border);border-radius:6px;" onmouseover="this.style.borderColor='var(--accent-dim)';this.style.color='var(--text)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-dim)'">🗺 Brain Map</a>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>
<div id="messages" role="log" aria-live="polite">
  <div id="empty">
    <div class="icon" aria-hidden="true">🧠</div>
    <p>Type a thought to capture it, or ask a question to search your brain.</p>
    <p>Type <strong>help</strong> to see all commands.</p>
  </div>
</div>
<div id="composer-host"></div>
<script src="/detail.js"></script>
<script src="/composer.js"></script>
<script>OpenBrainComposer.mount({ mode: 'store' });</script>
<script>
'use strict';
const messagesEl = document.getElementById('messages');
const emptyEl    = document.getElementById('empty');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send');
const composerEl = document.getElementById('composer');
const searchModeEl = document.getElementById('search-mode');
const searchModeLabelEl = document.getElementById('search-mode-label');
const aiSummarizeEl = document.getElementById('ai-summarize');
const aiSummarizeWrapEl = document.getElementById('ai-summarize-wrap');
const strategyWrapEl = document.getElementById('search-strategy-wrap');
const moreOptionsBtn = document.getElementById('more-options-btn');
const searchOptionsEl = document.getElementById('search-options');
const searchFromEl = document.getElementById('search-from');
const searchToEl = document.getElementById('search-to');
const searchTimeResetEl = document.getElementById('search-time-reset');
let searchStrategy = 'hybrid';
try {
  const savedStrategy = localStorage.getItem('openbrain.searchStrategy');
  if (savedStrategy === 'vector' || savedStrategy === 'hybrid' || savedStrategy === 'ai') searchStrategy = savedStrategy;
} catch (_) { /* storage unavailable */ }
const STRATEGY_LABELS = { vector: 'Fast', hybrid: 'Hybrid', ai: 'AI Search' };
const dotEl      = document.getElementById('dot');
const statusEl   = document.getElementById('status-text');

function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

let surfaceMode = 'store';
try {
  const savedMode = localStorage.getItem('openbrain.surfaceMode');
  if (savedMode === 'search' || savedMode === 'store') surfaceMode = savedMode;
} catch (_) { /* storage unavailable */ }

function updateSurfaceMode(mode) {
  surfaceMode = mode === 'search' ? 'search' : 'store';
  if (surfaceMode !== 'search') aiSummarizeEl.setAttribute('aria-pressed', 'false');
  aiSummarizeEl.disabled = surfaceMode !== 'search';
  aiSummarizeWrapEl.hidden = surfaceMode !== 'search';
  aiSummarizeWrapEl.classList.toggle('visible', surfaceMode === 'search');
  strategyWrapEl.classList.toggle('visible', surfaceMode === 'search');
  composerEl.classList.toggle('mode-search', surfaceMode === 'search');
  composerEl.classList.toggle('mode-store', surfaceMode === 'store');
  searchModeEl.setAttribute('aria-pressed', String(surfaceMode === 'search'));
  searchModeLabelEl.textContent = surfaceMode === 'search' ? 'Search' : 'Store';
  inputEl.placeholder = surfaceMode === 'search' ? 'What would you like to find?' : 'What would you like to remember?';
  const title = document.querySelector('#search-mode-tooltip .tooltip-title');
  const copy = document.querySelector('#search-mode-tooltip .tooltip-copy');
  title.textContent = surfaceMode === 'search' ? 'Search mode' : 'Store mode';
  copy.textContent = surfaceMode === 'search'
    ? 'Find saved thoughts using semantic similarity and keyword matching. Press Tab to switch to Store mode.'
    : 'Save what you enter to your knowledge base. Press Tab to switch to Search mode.';
  try { localStorage.setItem('openbrain.surfaceMode', surfaceMode); } catch (_) { /* storage unavailable */ }
}

function setSearchStrategy(mode) {
  if (!STRATEGY_LABELS[mode]) return;
  searchStrategy = mode;
  Array.prototype.forEach.call(strategyWrapEl.querySelectorAll('.strategy-option'), function(option) {
    option.setAttribute('aria-checked', String(option.dataset.mode === mode));
  });
  try { localStorage.setItem('openbrain.searchStrategy', mode); } catch (_) { /* storage unavailable */ }
}

function getSearchDateRange() {
  return { from: searchFromEl.value, to: searchToEl.value };
}

function normalizeSearchDateRange() {
  if (searchFromEl.value && searchToEl.value && searchFromEl.value > searchToEl.value) {
    searchToEl.value = searchFromEl.value;
  }
}

searchFromEl.addEventListener('change', normalizeSearchDateRange);
searchToEl.addEventListener('change', normalizeSearchDateRange);
searchTimeResetEl.addEventListener('click', function() {
  searchFromEl.value = '';
  searchToEl.value = '';
});
moreOptionsBtn.addEventListener('click', function() {
  const open = moreOptionsBtn.getAttribute('aria-expanded') === 'true';
  moreOptionsBtn.setAttribute('aria-expanded', String(!open));
  searchOptionsEl.hidden = open;
});
document.addEventListener('click', function(e) {
  if (!e.target.closest('#more-options')) {
    moreOptionsBtn.setAttribute('aria-expanded', 'false');
    searchOptionsEl.hidden = true;
  }
});

// Safe markdown rendering — splits text on tokens, builds DOM nodes, no innerHTML for content
function renderMarkdownSafe(text, container) {
  // Split on **bold**, *em*, `code` tokens
  const parts = text.split(/(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`)/);
  parts.forEach(function(part) {
    if (part.startsWith('**') && part.endsWith('**')) {
      const s = el('span', 'md-bold');
      s.textContent = part.slice(2, -2);
      container.appendChild(s);
    } else if (part.startsWith('*') && part.endsWith('*') && part.length > 2) {
      const s = el('span', 'md-em');
      s.textContent = part.slice(1, -1);
      container.appendChild(s);
    } else if (part.startsWith('`') && part.endsWith('`') && part.length > 2) {
      const s = el('span', 'md-code');
      s.textContent = part.slice(1, -1);
      container.appendChild(s);
    } else {
      container.appendChild(document.createTextNode(part));
    }
  });
}

// Block-aware markdown rendering for note bodies.
//
// The bubble renderer above only handles inline tokens and leans on the
// bubble's `white-space: pre-wrap` for structure, which reads as a mushy text
// dump inside a result card. This builds real block elements — paragraphs,
// lists, fenced code — and applies the inline tokenizer within each line.
// Everything is DOM-constructed (never innerHTML), so note content is always
// treated as text, not markup.
function renderNoteBody(text, container) {
  const lines = String(text == null ? '' : text).replace(/\r\n/g, '\n').split('\n');
  let i = 0;

  const flushParagraph = function(buf) {
    if (!buf.length) return;
    const p = el('p');
    buf.forEach(function(line, idx) {
      if (idx > 0) p.appendChild(el('br'));
      renderMarkdownSafe(line, p);
    });
    container.appendChild(p);
  };

  while (i < lines.length) {
    const line = lines[i];

    // ATX headings: render Markdown heading levels as real block elements.
    const heading = line.match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
    if (heading) {
      const level = Math.min(heading[1].length, 4);
      const title = el('h' + level);
      renderMarkdownSafe(heading[2], title);
      container.appendChild(title);
      i++;
      continue;
    }

    // Fenced code block: support Markdown fences made from two or more
    // backticks, including an optional language label. The closing fence must
    // be at least as long as the opening fence so backticks inside code stay
    // part of the code block.
    const fence = line.match(/^\s*(`{2,})([^`]*)$/);
    if (fence) {
	  const fenceLength = fence[1].length;
      i++;
      const code = [];
      const closingFence = new RegExp('^\\s*`{' + fenceLength + ',}\\s*$');
      while (i < lines.length && !closingFence.test(lines[i])) {
        code.push(lines[i]);
        i++;
      }
      if (i < lines.length) i++; // skip closing fence
      const pre = el('pre');
      const codeEl = el('code');
      codeEl.textContent = code.join('\n');
      pre.appendChild(codeEl);
      container.appendChild(pre);
      continue;
    }

    // Bullet list: consume the whole contiguous run.
    if (/^\s*[-*•]\s+/.test(line)) {
      const ul = el('ul');
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
        const li = el('li');
        renderMarkdownSafe(lines[i].replace(/^\s*[-*•]\s+/, ''), li);
        ul.appendChild(li);
        i++;
      }
      container.appendChild(ul);
      continue;
    }

    // Blank line: paragraph separator.
    if (/^\s*$/.test(line)) {
      i++;
      continue;
    }

    // Plain paragraph: gather until a blank line or a block starter.
    const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) &&
           !/^\s*[-*•]\s+/.test(lines[i]) && !/^\s*`{2,}[^`]*$/.test(lines[i]) &&
           !/^\s*#{1,6}\s+/.test(lines[i])) {
      buf.push(lines[i]);
      i++;
    }
    flushParagraph(buf);
  }

  // Guarantee the container is never left empty (e.g. whitespace-only note).
  if (!container.childNodes.length) {
    container.appendChild(document.createTextNode(''));
  }
}

function makeMsg(side) {
  const wrap = el('div', 'msg ' + side);
  const bubble = el('div', 'bubble');
  const meta   = el('div', 'meta');
  wrap.appendChild(bubble);
  wrap.appendChild(meta);
  return { wrap, bubble, meta };
}

function timeStr() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function hideEmpty() { if (emptyEl) emptyEl.style.display = 'none'; }
function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function appendUser(text) {
  hideEmpty();
  const { wrap, bubble, meta } = makeMsg('user');
  bubble.textContent = text;
  meta.textContent = timeStr();
  messagesEl.appendChild(wrap);
  scrollBottom();
}

// ── search results ──────────────────────────────────────────────────────────
//
// Search is a note-finder, not a conversation: results render as a structured
// list of discrete cards rather than a chat bubble containing a text dump.
// The backend sends `results` (structured rows) alongside `content` (the
// legacy plain-text rendering); we use the former and ignore the latter.

function tokenQS() {
  const token = new URLSearchParams(location.search).get('token') || '';
  return token ? '?token=' + encodeURIComponent(token) : '';
}

function typeBadge(type) {
  const badge = el('span', 'badge ' + (type || 'note'));
  badge.textContent = type || 'note';
  return badge;
}

// Builds one result card. The body is clamped by CSS; the expand toggle is
// only attached when the content actually overflows, so short notes get no
// dead affordance.
function buildResultCard(row) {
  const content = String(row.content || row.summary || '');
  const density = content.length <= 180 ? 'compact' : content.length <= 700 ? 'standard' : 'full';
  const card = el('article', 'result-card ' + density);

  const meta = el('div', 'result-meta');
  meta.appendChild(typeBadge(row.type));
  const kind = el('span', 'result-kind');
  kind.textContent = density === 'compact' ? 'Quick thought' : density === 'full' ? 'Full note' : 'Note';
  meta.appendChild(kind);
  if (row.created_at) {
    meta.appendChild(document.createTextNode(row.created_at));
  }
    (row.tags || []).forEach(function(tag) {
    const t = el('span', 'result-tag');
    t.textContent = tag;
      meta.appendChild(t);
    });
  if (row.metadata && row.metadata.capture_role) {
    const role = el('span', 'result-tag');
    role.textContent = row.metadata.capture_role === 'original_source' ? 'Original source' : 'AI-extracted thought';
    meta.appendChild(role);
  }
  if (typeof row.score === 'number') {
    const scoreWrap = el('span', 'result-score-wrap');
    const score = el('span', 'result-score');
    score.textContent = row.score.toFixed(2);
    score.setAttribute('aria-label', 'Relevance score ' + row.score.toFixed(2));
    const tooltip = el('span', 'score-tooltip');
    tooltip.setAttribute('role', 'tooltip');
    const tooltipTitle = el('span', 'tooltip-title');
    tooltipTitle.textContent = 'Relevance score';
    const tooltipCopy = el('span', 'tooltip-copy');
    tooltipCopy.textContent = 'A ranking signal combining semantic similarity (70%) and keyword matching (30%). Higher scores mean this thought matched the current search more strongly. The number is relative to this search, not a percentage or probability.';
    tooltip.appendChild(tooltipTitle);
    tooltip.appendChild(tooltipCopy);
    scoreWrap.appendChild(score);
    scoreWrap.appendChild(tooltip);
    meta.appendChild(scoreWrap);
  }
  card.appendChild(meta);

  const body = el('div', 'result-body note-body');
  // Prefer the summary as the preview when the backend supplied one.
  renderNoteBody(row.summary ? row.summary : row.content, body);
  card.appendChild(body);

  // The card is intentionally action-free. Clicking it opens the detail view,
  // which contains the complete note and the destructive action.
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', 'Open ' + (row.type || 'note'));
  card.addEventListener('click', function() { openDetail(row.id); });
  card.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openDetail(row.id);
    }
  });

  return card;
}

function applyResultRanking(card, row, index, total) {
  const rank = index + 1;
  const strength = total <= 1 ? 1 : 1 - (index / (total - 1)) * 0.72;
  const label = rank === 1 ? 'Top match' : rank === 2 ? 'Strong match' : rank === 3 ? 'Good match' : 'Related';
  card.classList.add('ranked', rank <= 3 ? 'rank-' + rank : 'rank-low');
  card.style.setProperty('--rank-strength', strength.toFixed(3));
  const rankLabel = el('span', 'rank-label');
  const rankNumber = el('span', 'rank-number');
  rankNumber.textContent = '#' + rank;
  rankLabel.appendChild(rankNumber);
  rankLabel.appendChild(document.createTextNode(label));
  card.querySelector('.result-meta').insertBefore(rankLabel, card.querySelector('.result-meta').firstChild);
  const meter = el('div', 'result-relevance');
  meter.setAttribute('aria-label', label + ', result ' + rank + ' of ' + total);
  card.insertBefore(meter, card.querySelector('.result-body'));
}

// The summary is an answer, not retrieval work, so it uses the same readable
// Markdown note body as result cards with a distinct visual treatment.
function buildSummaryCard(data) {
  const card = el('article', 'result-card summary-card');
  const meta = el('div', 'result-meta');
  meta.appendChild(typeBadge('AI summary'));
  meta.appendChild(document.createTextNode('Based on ' + data.summary_details.result_count + ' retrieved thoughts'));
  card.appendChild(meta);
  const body = el('div', 'result-body note-body summary-body');
  renderNoteBody(data.summary || 'No summary was returned.', body);
  card.appendChild(body);

  const actions = el('div', 'result-actions summary-actions');
  const toggle = el('button', 'result-btn');
  toggle.textContent = 'Show more';
  toggle.setAttribute('aria-expanded', 'false');
  toggle.addEventListener('click', function(e) {
    e.stopPropagation();
    const expanded = body.classList.toggle('expanded');
    toggle.textContent = expanded ? 'Show less' : 'Show more';
    toggle.setAttribute('aria-expanded', String(expanded));
  });
  actions.appendChild(toggle);
  card.appendChild(actions);

   return card;
}

// Plain-language description of each retrieval axis, shown in the work details
// so the combined ranking is explainable rather than opaque.
const AXIS_COPY = [
  ['lexical', 'notes containing your exact words'],
  ['semantic', 'notes that mean something similar'],
  ['literal', 'your original query, kept as an exact-match signal'],
  ['contextual_expansion', 'the grounded meaning generated from the probe notes'],
  ['contextual_lexical', 'exact words from the grounded interpretation'],
];

function appendSearchResults(data) {
  hideEmpty();
  const rows = Array.isArray(data.results) ? data.results : [];
  const wrap = el('div', 'results');

  const head = el('div', 'results-head');
  const count = el('span', 'results-count');
  count.textContent = rows.length === 1 ? '1 result' : rows.length + ' results';
  head.appendChild(count);
  head.appendChild(document.createTextNode(timeStr()));
  wrap.appendChild(head);

  if (data.mode === 'assisted' && Array.isArray(data.axes_used) && data.axes_used.length) {
    const work = el('details', 'search-work');
    const summary = el('summary');
    summary.appendChild(document.createTextNode(
      'Multi-axis search \u00b7 ' + data.axes_used.join(', ') + ' \u00b7 ' + rows.length + ' results'));
    work.appendChild(summary);
    const content = el('div', 'search-work-content');
    if (data.search_expansion) {
      const expansion = data.search_expansion;
      content.appendChild(document.createTextNode(
        'The local model read the initial probe notes and interpreted your query as:'));
      const interpretation = el('span', 'search-query');
      interpretation.textContent = expansion.interpretation || 'No interpretation returned';
      content.appendChild(interpretation);
      if (Array.isArray(expansion.terms) && expansion.terms.length) {
        const terms = el('span', 'search-query');
        terms.textContent = 'Expanded search terms: ' + expansion.terms.join(', ');
        content.appendChild(terms);
      }
      const confidence = el('span', 'search-query');
      confidence.textContent = 'Model confidence: ' + Math.round(Number(expansion.confidence || 0) * 100) + '%';
      content.appendChild(confidence);
    } else {
      content.appendChild(document.createTextNode(
        'The contextual model did not produce a grounded expansion, so the exact query was searched using the deterministic retrieval axes. No extra search terms were invented.'));
    }
    AXIS_COPY.forEach(function(entry) {
      if (data.axes_used.indexOf(entry[0]) === -1) return;
      const line = el('span', 'search-query');
      line.textContent = entry[0] + ' — ' + entry[1];
      content.appendChild(line);
    });
    work.appendChild(content);
    wrap.appendChild(work);
  }
  if (data.mode === 'ai' && Array.isArray(data.axes_used) && data.axes_used.length) {
    const work = el('details', 'search-work');
    const summary = el('summary');
    summary.textContent = 'AI Search · ' + data.axes_used.length + ' searches · ' + rows.length + ' results';
    work.appendChild(summary);
    const content = el('div', 'search-work-content');
    content.appendChild(document.createTextNode('The local model selected these safe, read-only searches:'));
    data.axes_used.forEach(function(step) {
      const line = el('span', 'search-query');
      line.textContent = step;
      content.appendChild(line);
    });
    work.appendChild(content);
    wrap.appendChild(work);
  }

  if (data.summary_details) {
    if (data.summary_details.error) {
      const work = el('details', 'search-work');
      work.open = true;
      const summary = el('summary');
      summary.textContent = 'AI summary · based on ' + data.summary_details.result_count + ' retrieved thoughts';
      work.appendChild(summary);
      const content = el('div', 'search-work-content');
      content.textContent = 'The local model could not summarize these results: ' + data.summary_details.error;
      work.appendChild(content);
      wrap.appendChild(work);
    } else {
      wrap.appendChild(buildSummaryCard(data));
    }
  }

  if (!rows.length) {
    const none = el('div', 'results-empty');
    none.textContent = 'No matching notes.';
    wrap.appendChild(none);
  } else {
    rows.forEach(function(row, index) {
      const card = buildResultCard(row);
      applyResultRanking(card, row, index, rows.length);
      wrap.appendChild(card);
    });
  }

  messagesEl.appendChild(wrap);
  // Search results can be taller than the viewport. Start at the newest
  // result block so the highest-ranked match is immediately visible.
  requestAnimationFrame(function() {
    messagesEl.scrollTo({ top: Math.max(0, wrap.offsetTop - 12), behavior: 'smooth' });
  });
}

function appendCaptureDetails(data, content) {
  if (!data.capture_details) return;
  const details = data.capture_details;
  const work = el('details', 'search-work');
  const summary = el('summary');
  const count = Array.isArray(details.extracted) ? details.extracted.length : 0;
  summary.textContent = 'AI-assisted storage · preserved original and extracted ' + count + ' thoughts';
  work.appendChild(summary);
  const body = el('div', 'search-work-content');
  body.appendChild(document.createTextNode(details.original_preserved
    ? 'The original text was stored verbatim. The local model organized it into these additional thoughts:'
    : 'The original text was stored as a fallback note.'));
  (details.extracted || []).forEach(function(thought) {
    const line = el('span', 'search-query');
    line.textContent = '[' + (thought.thought_type || 'note') + '] ' + thought.content;
    body.appendChild(line);
  });
  work.appendChild(body);
  content.appendChild(work);
}

// ── note detail panel ───────────────────────────────────────────────────────
const detailContent = window.OpenBrainDetail.content;
const detailTitle = window.OpenBrainDetail.title;
const detailDeleteBtn = window.OpenBrainDetail.deleteBtn;
const closeDetail = window.OpenBrainDetail.close;

detailDeleteBtn.style.display = 'inline-block';
detailDeleteBtn.onclick = function() {
  if (detailDeleteBtn.dataset.id) deleteThought(detailDeleteBtn.dataset.id, null, true);
};

async function openDetail(id) {
  if (!id) return;
  window.OpenBrainDetail.open('Note');
  detailContent.textContent = 'Loading…';
  detailDeleteBtn.dataset.id = id;
  detailDeleteBtn.disabled = false;

  try {
    const res = await fetch('/api/thought/' + encodeURIComponent(id) + tokenQS());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const t = await res.json();

    detailTitle.textContent = t.type || 'Note';
    detailContent.textContent = '';

    const meta = el('div', 'detail-meta');
    meta.appendChild(typeBadge(t.type));
    if (t.created_at) meta.appendChild(document.createTextNode(t.created_at));
    if (t.source) {
      const src = el('span', 'result-tag');
      src.textContent = t.source;
      meta.appendChild(src);
    }
    (t.tags || []).forEach(function(tag) {
      const el2 = el('span', 'result-tag');
      el2.textContent = tag;
      meta.appendChild(el2);
    });
    if (t.metadata && t.metadata.capture_role) {
      const role = el('span', 'result-tag');
      role.textContent = t.metadata.capture_role === 'original_source' ? 'Original source' : 'AI-extracted thought';
      meta.appendChild(role);
    }
    detailContent.appendChild(meta);

    if (t.summary) {
      const sum = el('div', 'note-body');
      renderNoteBody(t.summary, sum);
      detailContent.appendChild(sum);
    }

    const bodyWrap = el('div', 'note-body');
    renderNoteBody(t.content, bodyWrap);
    detailContent.appendChild(bodyWrap);
  } catch (err) {
    detailContent.textContent = 'Failed to load note: ' + err.message;
  }
}

async function deleteThought(id, card, closePanel) {
  if (!id || !window.confirm('Permanently delete this thought? This cannot be undone.')) return;
  try {
    const res = await fetch('/api/thought-delete/' + encodeURIComponent(id) + tokenQS(), { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (card) card.remove();
    if (closePanel) closeDetail();
  } catch (err) {
    window.alert('Failed to delete thought: ' + err.message);
  }
}

function appendBrain(text, intent, thoughtType) {
  hideEmpty();
  const { wrap, bubble, meta } = makeMsg('brain');
  renderMarkdownSafe(text, bubble);
  const badgeClass = intent === 'capture' ? (thoughtType || 'note') : (intent || '');
  const badgeLabel = intent === 'capture' ? (thoughtType || 'note') : intent;
  const timeNode = document.createTextNode(timeStr() + ' ');
  const badge = el('span', 'badge ' + badgeClass);
  badge.textContent = badgeLabel;
  meta.appendChild(timeNode);
  meta.appendChild(badge);
  messagesEl.appendChild(wrap);
  scrollBottom();
}

function appendAmbiguous(data) {
  hideEmpty();
  const wrap = el('div', 'ambiguity');
  const card = el('div', 'ambiguity-card');
  card.textContent = data.content || 'Should I search for this or save it as a note?';
  const actions = el('div', 'ambiguity-actions');
  [['Search for this', 'search'], ['Save as note', 'capture']].forEach(function(item) {
    const button = el('button');
    button.textContent = item[0];
    button.addEventListener('click', function() {
      wrap.remove();
      submitMessage(data.query, item[1], false);
    });
    actions.appendChild(button);
  });
  wrap.appendChild(card);
  wrap.appendChild(actions);
  messagesEl.appendChild(wrap);
  scrollBottom();
}

let typingEl = null;
function showTyping() {
  if (typingEl) return;
  typingEl = el('div', 'msg brain typing');
  const bubble = el('div', 'bubble');
  [0,1,2].forEach(function() { bubble.appendChild(el('div', 'dot-pulse')); });
  typingEl.appendChild(bubble);
  messagesEl.appendChild(typingEl);
  scrollBottom();
}
function removeTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

// WebSocket with auto-reconnect
let ws;
let reconnectDelay = 1000;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws' + location.search);
  ws.onopen = function() {
    dotEl.classList.add('connected');
    statusEl.textContent = 'Connected';
    sendBtn.disabled = false;
    reconnectDelay = 1000;
  };
  ws.onclose = function() {
    dotEl.classList.remove('connected');
    statusEl.textContent = 'Reconnecting…';
    sendBtn.disabled = true;
    removeTyping();
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
  };
  ws.onerror = function() { ws.close(); };
  ws.onmessage = function(e) {
    removeTyping();
    let data;
    try { data = JSON.parse(e.data); } catch(err) { return; }
    if (data.ambiguous) {
      data.query = data.query || data.content;
      appendAmbiguous(data);
      return;
    }
    // Search replies carry structured rows and render as a result list.
    // Every other intent keeps the existing conversational bubble.
    if (data.intent === 'search' && Array.isArray(data.results)) {
      appendSearchResults(data);
      return;
    }
    if (data.capture_details) {
      const wrap = el('div', 'results');
      const response = el('div', 'msg brain');
      const bubble = el('div', 'bubble');
      bubble.textContent = data.content || '';
      response.appendChild(bubble);
      wrap.appendChild(response);
      appendCaptureDetails(data, wrap);
      messagesEl.appendChild(wrap);
      scrollBottom();
      return;
    }
    appendBrain(data.content || '', data.intent || '', data.thought_type || '');
  };
}

connect();

function submitMessage(text, explicitIntent, showUser) {
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  if (showUser !== false) appendUser(text);
  const message = { message: text };
  if (explicitIntent) message.intent = explicitIntent;
  message.surface_mode = surfaceMode;
  message.mode = surfaceMode === 'search' ? searchStrategy : '';
  if (surfaceMode === 'search') {
    const range = getSearchDateRange();
    if (range.from) message.from = range.from;
    if (range.to) message.to = range.to;
  }
  message.ai_summarize = surfaceMode === 'search' && aiSummarizeEl.getAttribute('aria-pressed') === 'true';
  ws.send(JSON.stringify(message));
  showTyping();
  inputEl.style.height = 'auto';
}

function send() {
  const text = inputEl.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  submitMessage(text, '', true);
  inputEl.value = '';
  inputEl.style.height = 'auto';
}

searchModeEl.addEventListener('click', function() {
  updateSurfaceMode(surfaceMode === 'search' ? 'store' : 'search');
});

Array.prototype.forEach.call(strategyWrapEl.querySelectorAll('.strategy-option'), function(option) {
  option.addEventListener('click', function() { setSearchStrategy(option.dataset.mode); });
});

aiSummarizeEl.addEventListener('click', function() {
  if (surfaceMode !== 'search') return;
  const enabled = aiSummarizeEl.getAttribute('aria-pressed') !== 'true';
  aiSummarizeEl.setAttribute('aria-pressed', String(enabled));
});

inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    updateSurfaceMode(surfaceMode === 'search' ? 'store' : 'search');
  }
});

updateSurfaceMode(surfaceMode);
setSearchStrategy(searchStrategy);

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', function() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Forward ?token= (and any other query params) to the Brain Map link so the
// token is carried across navigation when the server has auth enabled.
if (location.search) {
  var graphLink = document.getElementById('graph-link');
  if (graphLink) { graphLink.href = '/graph' + location.search; }
}
</script>
